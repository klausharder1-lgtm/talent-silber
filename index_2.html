<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0A0F12">
<title>Die Gasse der Mauern</title>
<title>Die Gasse der Mauern</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=Spectral:ital,wght@0,400;0,600&display=swap">
<style>
:root{
  --ink:#0A0F12; --ink2:#0E161A; --panel:#131D22; --panel2:#1A272E; --panel3:#22333B;
  --line:#26363E; --line2:#33474F;
  --silver:#DCE5E8; --silver-dim:#94A6AE; --silver-low:#5E727B;
  --gold:#D6A94E; --verd:#5BAE94; --rust:#C4634A;
  --disp:'Cinzel',serif; --body:'Spectral',Georgia,serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--silver);font-family:var(--body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
.wrap{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
h1,h2{font-family:var(--disp);margin:0;letter-spacing:.02em;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--silver-low)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{font-size:14px;color:var(--silver-dim)}
.muenze{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:5px;vertical-align:baseline;
  background:radial-gradient(circle at 34% 28%,#FBE8B4,var(--gold) 55%,#8C6B27)}
.hud{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:12px 14px 8px}
.hud>div{min-width:0}
.hud .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .n{font-family:var(--mono);font-size:clamp(22px,7.5vw,32px);font-weight:600;color:var(--gold);line-height:1;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.hud .n.puls{animation:puls .35s ease-out}
@keyframes puls{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
.bahn{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(120% 55% at 50% 0%,rgba(214,169,78,.10),transparent 60%),
  linear-gradient(180deg,#0C1418,#0A0F12 60%,#070C0F)}
canvas{display:block;width:100%;height:100%}
.fuss{padding:10px 14px calc(14px + env(safe-area-inset-bottom));text-align:center}
.fuss .hint{font-size:clamp(12px,3.6vw,14px);display:block;overflow-wrap:anywhere}
.serie{position:absolute;left:0;right:0;bottom:56px;display:flex;gap:6px;justify-content:center;align-items:center;
  pointer-events:none;opacity:0;transition:opacity .25s;z-index:3}
.serie.an{opacity:1}
.serie i{width:9px;height:9px;border-radius:50%;background:var(--line2);display:block;transition:background .2s,transform .2s}
.serie i.voll{background:var(--gold);transform:scale(1.35);box-shadow:0 0 10px rgba(214,169,78,.8)}
.serie span{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-left:6px}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;z-index:4;opacity:0}
.banner.an{animation:ban 1.4s ease-out}
.banner b{font-family:var(--disp);font-size:clamp(22px,7.5vw,32px);color:var(--gold);text-shadow:0 2px 20px rgba(0,0,0,.9);letter-spacing:.03em}
@keyframes ban{0%{opacity:0;transform:scale(.8)}20%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.08)}}
.konfetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.konfetti i{position:absolute;top:-14px;width:7px;height:11px;border-radius:1px;opacity:0;animation:fallen linear infinite}
@keyframes fallen{0%{opacity:0;transform:translateY(-20px) rotate(0deg)}
  8%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(105vh) rotate(540deg)}}
.ov{position:absolute;inset:0;display:grid;place-items:center;padding:22px;z-index:5;
  background:rgba(6,10,12,.82);backdrop-filter:blur(3px);animation:ein .25s ease-out}
@keyframes ein{from{opacity:0}to{opacity:1}}
.karte{max-width:400px;width:100%;text-align:center;overflow-wrap:anywhere}
.karte h1,.karte h2{font-size:clamp(20px,6.4vw,27px);line-height:1.2}
.btn{display:block;width:100%;min-height:54px;padding:15px 12px;margin-top:14px;font-family:var(--mono);
  font-size:clamp(11px,3.3vw,13px);letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:#2A200A;cursor:pointer;
  background:linear-gradient(180deg,#F0CE85,#C99C42);border:1px solid #E4C177;border-radius:2px}
.btn.quiet{background:none;border:1px solid var(--line2);color:var(--silver-dim)}
.btn:active{transform:translateY(1px)}
.tick{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:clamp(11px,3.4vw,13px);
  padding:8px 0;border-bottom:1px dotted var(--line);text-align:left}
.tick span{min-width:0;overflow-wrap:anywhere}
.tick b{white-space:nowrap}
.tick:last-child{border-bottom:none}
.coinbig{width:118px;height:118px;border-radius:50%;margin:0 auto 18px;position:relative;isolation:isolate;
  box-shadow:0 10px 26px rgba(0,0,0,.65);animation:kippen 7s ease-in-out infinite}
@keyframes kippen{0%,100%{transform:rotateY(-8deg) rotateX(3deg)}50%{transform:rotateY(8deg) rotateX(-2deg)}}
.coinbig img{width:100%;height:100%;display:block;border-radius:50%}
.coinbig::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.30) 47%,transparent 58%);
  animation:glanz 5.5s ease-in-out infinite}
@keyframes glanz{0%,100%{opacity:.2;transform:translateX(-10%)}50%{opacity:.55;transform:translateX(10%)}}
.verse{font-style:italic;color:var(--silver-dim);font-size:clamp(13px,4vw,15px);overflow-wrap:anywhere;border-left:2px solid #8C6F33;padding-left:12px;text-align:left;margin-top:16px}
.verse cite{display:block;font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--silver-low);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div><div class="eyebrow">Dein Geld</div><div class="n mono" id="score">1.000</div></div>
    <div style="text-align:right"><div class="eyebrow">Mauern</div><div class="mono" id="tore" style="font-size:19px">0 / 60</div></div>
  </div>
  <div class="bahn" id="bahn"><canvas id="c"></canvas><div class="banner" id="banner"><b></b></div></div>
  <div class="serie" id="serie"><i></i><i></i><i></i><i></i><i></i><span id="serieT">Serie</span></div>
  <div class="fuss"><span class="hint" id="fuss">Zieh den Finger nach links oder rechts</span></div>
</div>

/* ================= Klang ================= */
let ac=null, tonAn=true;
function audio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ac; }
function ton(f,d,typ,vol){
  const a=audio(); if(!a||!tonAn) return;
  const t=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type=typ||"triangle"; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(vol||.09,t); g.gain.exponentialRampToValueAtTime(.0006,t+(d||.18));
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+(d||.18)+.02);
}
function klirren(stufe){ const sk=[523,587,659,784,880,1047,1175,1319];
  ton(sk[Math.min(sk.length-1,stufe)],.22,"triangle",.08);
  ton(sk[Math.min(sk.length-1,stufe)]*2,.12,"sine",.04); }
function dumpf(){ const a=audio(); if(!a||!tonAn) return;
  const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type="sine"; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(52,t+.22);
  g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+.3);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.32); }
function funkeln(){ [1046,1318,1568,2093].forEach((f,i)=>setTimeout(()=>ton(f,.3,"triangle",.07),i*55)); }
function rumpeln(){ ton(90,.5,"sawtooth",.05); }

/* ================= Tore ================= */
const GEWINN=["mul15","mul155","addHalb"];   /* selten: die einzige grüne Bahn */
const MILD  =["pct88","pct85","pct82"];      /* das kleinere Übel */
const HART  =["div2","pct50","pct45","pct55"];/* der Fehler */
const KURZ_HART=["div2","pct50","pct45","pct55"];
const P_GEWINN=0.34;
const ABSCHNITTE=[
  {ab:0,  n:"Die Gasse der Händler"},
  {ab:7,  n:"Das Tor der Färber"},
  {ab:14, n:"Der große Basar"},
  {ab:22, n:"Der Weg zum Haus des Herrn"}
];
function hübsch(n){
  n=Math.round(n);
  if(n<20) return Math.max(1,n);
  if(n<200) return Math.round(n/5)*5;
  if(n<2000) return Math.round(n/10)*10;
  return Math.round(n/50)*50;
}
function kurz(n){
  n=Math.round(n);
  if(n>=1000000) return (n/1000000).toFixed(1).replace(".",",")+" Mio";
  if(n>=10000) return Math.round(n/1000)+"k";
  return n.toLocaleString("de-DE");
}
/* Werte entstehen erst, wenn die Mauer in Sicht kommt — immer bezogen auf das, was du JETZT hast */
function bau(art,s){
  switch(art){
    case "mul15":   return {k:"mul",v:1.5,  t:"×1,5"};
    case "mul155":  return {k:"mul",v:1.55, t:"×1,55"};
    case "addHalb": {const n=hübsch(s*0.5); return {k:"add",v:n,t:"+"+kurz(n)};}
    case "pct88":   return {k:"pct",v:.88,  t:"−12 %"};
    case "pct85":   return {k:"pct",v:.85,  t:"−15 %"};
    case "pct82":   return {k:"pct",v:.82,  t:"−18 %"};
    case "div2":    return {k:"div",v:2,    t:"÷2"};
    case "pct45":   return {k:"pct",v:.55,  t:"−45 %"};
    case "pct50":   return {k:"pct",v:.5,   t:"−50 %"};
    case "pct55":   return {k:"pct",v:.45,  t:"−55 %"};
  }
}


const gut = op => op.k==="mul" || op.k==="add";
function wert(op,s,doppelt){
  const f = doppelt ? 1.6 : 1;
  if(op.k==="mul") return s + (s*op.v - s)*f;
  if(op.k==="add") return s + op.v*f;
  if(op.k==="div") return s - (s - s/op.v)*f;
  if(op.k==="sub") return s - op.v*f;
  return s - (s - s*op.v)*f;
}

/* ================= Zustand ================= */
const ANZ=28, START=100, TOD=20, BASIS=300;
let S={}, lauf=false, letzte=0, partikel=[], schweber=[], spur=[];
let BEST=0; try{ BEST=+(localStorage.getItem("gasse.best")||0); }catch(e){}
function merkeBest(v){ if(v>BEST){ BEST=v; try{ localStorage.setItem("gasse.best",String(Math.round(v))); }catch(e){} } }
const tempoBei = i => BASIS + i*5.5;
const abstandBei = i => tempoBei(i) * (1.35 - Math.min(.5, i*0.019));
function abschnittVon(i){ let a=ABSCHNITTE[0]; ABSCHNITTE.forEach(x=>{ if(i>=x.ab) a=x; }); return a; }
const zufall = a => a[Math.floor(Math.random()*a.length)];

function neu(){
  S={ silber:START, zeige:START, x:.5, ziel:.5, tore:[], raeuber:[], durch:0, weg:0,
      serie:0, serieMax:0, schuettel:0, blitz:0, blitzF:"#F0CE85", abschnitt:"", wartet:true, tot:false, schutz:0, talis:[] };
  let y=-300;
  for(let i=0;i<ANZ;i++){
    const phase = i<6?0:(i<13?1:(i<21?2:3));
    const gold  = i>5 && i<ANZ-2 && Math.random()<.07;
    let bahnen = 2;
    if(!gold){
      if(phase===0) bahnen = i<3 ? 2 : 3;
      else if(phase===1) bahnen = Math.random()<.30 ? 4 : 3;
      else if(phase===2) bahnen = Math.random()<.60 ? 4 : 3;
      else bahnen = Math.random()<.80 ? 4 : 3;
    }
    const chance = !gold && Math.random()<P_GEWINN;   /* nur hier gibt es überhaupt etwas zu gewinnen */
    let arten;
    if(gold) arten = Math.random()<.5 ? ["gold+","gold-"] : ["gold-","gold+"];
    else {
      arten = [ zufall(chance ? GEWINN : MILD) ];
      while(arten.length<bahnen) arten.push(zufall(HART));
      for(let k=arten.length-1;k>0;k--){ const q=Math.floor(Math.random()*(k+1)); const h=arten[k]; arten[k]=arten[q]; arten[q]=h; }
    }
    const zoll = !gold && !chance;
    S.tore.push({ y, arten, felder:null, fertig:false, gold, zoll, endspurt:i>=ANZ-2, i });
    const rw = phase===0 ? (i>6?.18:0) : (phase===1?.4:(phase===2?.55:.7));
    if(Math.random()<rw) S.raeuber.push({ y:y+rnd(80,150), x:rnd(.12,.88), fertig:false });
    if(phase===3 && Math.random()<.28) S.raeuber.push({ y:y+rnd(50,180), x:rnd(.12,.88), fertig:false });
    if(i>3 && Math.random()<.22) S.talis.push({ y:y+rnd(70,160), x:rnd(.15,.85), fertig:false });
    y-=abstandBei(i);
  }
  partikel=[]; schweber=[]; spur=[];
  elScore.textContent=fmt(START); elTore.textContent="0 / "+ANZ;
  elFuss.textContent="Tipp ihn an — dann läuft er los";
  zeigeSerie();
}
/* Die Zahlen auf der Mauer entstehen erst kurz bevor du sie siehst */
function konkret(tor){

    if(a==="gold-") return {k:"div",v:2,t:"÷2",gold:1};

  });
}

function stufeMuenze(s){
  if(s>=1000) return {r:22,a:"#FFF6DC",b:"#F0CE85",c:"#B8862B",n:"zehn Pfund"};
  if(s>=500)  return {r:20,a:"#FFFBEE",b:"#E7D9A6",c:"#9C8B4E",n:"fünf Pfund"};
  if(s>=200)  return {r:18,a:"#FFFFFF",b:"#DCE5E8",c:"#7C8D95",n:"zwei Pfund"};
  return {r:16,a:"#FFFFFF",b:"#C9D4D8",c:"#5D6E76",n:"ein Pfund"};
}
function zeichneTor(t){
  const h=72, y=t.y, n=t.felder.length, bw=W/n;
  const nah=Math.max(0,1-Math.abs((y+h/2)-H*0.74)/380);
  t.felder.forEach((op,k)=>{
    const x0=k*bw;
    let f;
    if(op.gold) f = op.k==="mul" ? {a:"#F0CE85",st:"#7A5C1E",fu:"#5C4415",t:"#3A2C0E"}
                                 : {a:"#9B7BAE",st:"#3D2A47",fu:"#2A1C31",t:"#E8D6F2"};
    else f = gut(op) ? {a:"#5BAE94",st:"#2A4C44",fu:"#1D352F",t:"#DFF5EC"}
                     : {a:"#C4634A",st:"#4E2A22",fu:"#361D17",t:"#FFE1D8"};
    /* Mauerwerk */
    ctx.fillStyle=f.st; ctx.fillRect(x0+2,y,bw-4,h);
    ctx.fillStyle=f.fu;
    for(let r=0;r<3;r++){
      const yy=y+r*(h/3), vers=(r%2)*22;
      for(let c=-1;c<Math.ceil(bw/44)+1;c++){
        ctx.fillRect(x0+2+c*44+vers, yy, 42, h/3-3);
      }
    }
    ctx.fillStyle=f.st; ctx.globalAlpha=.5;
    for(let r=0;r<3;r++){ const yy=y+r*(h/3), vers=(r%2)*22;
      for(let c=-1;c<Math.ceil(bw/44)+1;c++) ctx.fillRect(x0+3+c*44+vers, yy+1, 40, 5); }
    ctx.globalAlpha=1;
    ctx.strokeStyle=f.a; ctx.lineWidth=t.endspurt?3:2;
    ctx.globalAlpha=.5+nah*.5; ctx.strokeRect(x0+2,y,bw-4,h); ctx.globalAlpha=1;
    if(op.gold){ ctx.shadowColor=f.a; ctx.shadowBlur=16+nah*22; ctx.strokeRect(x0+2,y,bw-4,h); ctx.shadowBlur=0; }
    /* Aufschrift */
    const lang=op.t.length;
    const basisG = n>=4 ? (lang>5?12:15) : (n===3 ? (lang>6?15:(lang>4?18:22)) : (lang>7?19:(lang>5?23:28)));
    ctx.font="700 "+Math.round(basisG*(1+nah*.1))+"px 'IBM Plex Mono',monospace";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillText(op.t,x0+bw/2+1.5,y+h/2+1.5);
    ctx.fillStyle=f.a; ctx.fillText(op.t,x0+bw/2,y+h/2);
    if(k>0){ ctx.fillStyle="#0A0F12"; ctx.fillRect(x0-2,y-4,4,h+8); }
  });
  if(t.endspurt||t.zoll){
    ctx.fillStyle=t.zoll?"rgba(196,99,74,.9)":"rgba(214,169,78,.85)"; ctx.font="600 10px 'IBM Plex Mono',monospace";
    ctx.textAlign="center"; ctx.fillText(t.endspurt?"ENDSPURT · VERSTÄRKT":"ALLE KOSTEN", W/2, y-9);
  }
}
function zeichneTalisman(t){
  const x=t.x*W, y=t.y, p=performance.now()/420;
  const r=13+Math.sin(p)*1.6;
  const g=ctx.createRadialGradient(x,y,2,x,y,r*2.6);

  ctx.lineWidth=1.4; ctx.strokeStyle="rgba(255,246,220,.9)";

function zeichneRaeuber(r){
  const x=r.x*W, y=r.y;
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle="#0B1014"; ctx.beginPath(); ctx.ellipse(0,4,15,20,0,0,7); ctx.fill();
  ctx.fillStyle="#16212A"; ctx.beginPath(); ctx.arc(0,-14,9,0,7); ctx.fill();
  ctx.strokeStyle="#C4634A"; ctx.lineWidth=1.6; ctx.globalAlpha=.8;

  ctx.fillStyle="#C4634A"; ctx.font="600 9px 'IBM Plex Mono',monospace"; ctx.textAlign="center";
  ctx.fillText("RÄUBER",0,34);

function zeichneLaeufer(x,y,st,puls,phase){
  const sc=(S.wartet?1.15:0.80), w=SP_W*sc, h=SP_H*sc;
  const bob=Math.sin(phase*Math.PI*2)*2.5;
  /* weicher Schein hinter ihm, wächst mit dem Vermögen */
  const stark=.10+puls*.30+(st.r-16)*0.012;
  const gg=ctx.createRadialGradient(x,y,4,x,y,h*0.62);
  gg.addColorStop(0,"rgba(240,206,133,"+stark.toFixed(3)+")");
  gg.addColorStop(1,"rgba(240,206,133,0)");
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,h*0.62,0,7); ctx.fill();
  /* Schatten am Boden */
  const sg=ctx.createRadialGradient(x,y+h*0.45,2,x,y+h*0.45,w*0.5);
  sg.addColorStop(0,"rgba(0,0,0,.55)"); sg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=sg; ctx.beginPath(); ctx.ellipse(x,y+h*0.45,w*0.5,8,0,0,7); ctx.fill();
  if(S.schutz>0){
    const p=performance.now()/300;
    for(let k=0;k<S.schutz;k++){
      ctx.save(); ctx.translate(x,y-6); ctx.rotate(p+k*2.1);
      ctx.strokeStyle="rgba(240,206,133,.85)"; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.ellipse(0,0,w*0.78,h*0.34,0,-0.5,0.5); ctx.stroke();
      ctx.restore();
    }
  }
  if(S.wartet && blickDa){
    const at=1+Math.sin(performance.now()/620)*0.012;
    ctx.drawImage(BLICK, 0,0,SP_W,SP_H, x-w*at/2, y-h*at*0.56, w*at, h*at);
  } else if(spriteDa){
    const f=Math.floor(phase*SP_N)%SP_N;
    ctx.drawImage(SPRITE, f*SP_W,0,SP_W,SP_H, x-w/2, y-h*0.56+bob, w, h);
  } else {
    ctx.beginPath(); ctx.arc(x,y,15,0,7); ctx.fillStyle=st.b; ctx.fill();
  }
}
function rahmen(){
  ctx.save();
  if(S.schuettel>0){ ctx.translate(rnd(-1,1)*S.schuettel, rnd(-1,1)*S.schuettel); }
  ctx.clearRect(-20,-20,W+40,H+40);
  ctx.fillStyle="rgba(255,255,255,.025)"; ctx.fillRect(0,0,10,H); ctx.fillRect(W-10,0,10,H);
  for(let i=0;i<20;i++){
    const y=((S.weg*.45)+i*93)%H;
    ctx.fillStyle="rgba(220,229,232,"+(0.02+((i%5)*0.013))+")";
    ctx.fillRect((i*71)%W, y, 2, 22+ (i%3)*10);
  }
  S.tore.forEach(t=>{ if(t.y>-100 && t.y<H+50 && t.felder) zeichneTor(t); });
  S.raeuber.forEach(r=>{ if(!r.fertig && r.y>-60 && r.y<H+40) zeichneRaeuber(r); });
  S.talis.forEach(t=>{ if(!t.fertig && t.y>-40 && t.y<H+40) zeichneTalisman(t); });
  const cx=S.x*W, cy=H*0.74, st=stufeMuenze(S.silber);
  /* Staub unter den Füßen */
  spur.forEach((p,i)=>{ const a=(i/spur.length)*.18;
    ctx.globalAlpha=a; ctx.beginPath(); ctx.ellipse(p.x,p.y+52,10+i*1.4,3.5,0,0,7);
    ctx.fillStyle="#8FA3AB"; ctx.fill(); ctx.globalAlpha=1; });
  partikel.forEach(p=>{ ctx.save(); ctx.globalAlpha=Math.max(0,p.l);
    ctx.translate(p.x,p.y); ctx.rotate(p.rot||0); ctx.fillStyle=p.c;
    ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*(p.hoch||1)); ctx.restore(); ctx.globalAlpha=1; });
  zeichneLaeufer(cx,cy,st,Math.max(0,S.blitz),(S.weg/58)%1);
  schweber.forEach(s=>{ ctx.globalAlpha=Math.max(0,s.l); ctx.fillStyle=s.c;
    ctx.font="600 "+(s.gr||20)+"px 'IBM Plex Mono',monospace"; ctx.textAlign="center";
    ctx.fillText(s.t,s.x,s.y); ctx.globalAlpha=1; });
  ctx.restore();
  if(S.blitz>0){ ctx.fillStyle=S.blitzF; ctx.globalAlpha=S.blitz*.22; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
}

/* ================= Schleife ================= */
function durchfahrt(tor){
  const cx=S.x*W, cy=H*0.74, n=tor.felder.length, bw=W/n;
  const idx=Math.max(0,Math.min(n-1,Math.floor(cx/bw)));
  const op=tor.felder[idx];
  const mitte=(idx+.5)*bw;
  const perfekt=Math.abs(cx-mitte) < bw*0.16;
  const vor=S.silber;
  let neuW=wert(op,S.silber,tor.endspurt);
  if(gut(op)){
    S.serie++;
    const bonus = S.serie>=3 ? (1+Math.min(.15,(S.serie-2)*.05)) : 1;
    neuW = vor + (neuW-vor)*bonus;
    if(perfekt) neuW = vor + (neuW-vor)*1.15;
  } else if(S.schutz>0){
    S.schutz--; neuW=vor;
    schweber.push({x:cx,y:cy-86,t:"ABGEWEHRT",c:"#F0CE85",l:1,gr:15});
    funkeln(); summen(30);
  } else S.serie=0;
  S.silber=Math.max(0,neuW);
  const diff=S.silber-vor;
  const f = op.gold ? (gut(op)?"#F0CE85":"#C9A0DC") : (gut(op)?"#DFF5EC":"#FFE1D8");
  schweber.push({x:cx,y:cy-54,t:(diff>=0?"+":"−")+kurz(Math.round(Math.abs(diff))),c:f,l:1,gr:tor.endspurt?26:21});
  if(perfekt&&gut(op)) schweber.push({x:cx,y:cy-86,t:"PERFEKT",c:"#F0CE85",l:1,gr:14});
  const brocken = op.gold?"#C9A24A":(gut(op)?"#3C6B5E":"#6B3126");
  const anz=op.gold?40:(gut(op)?26:18);
  for(let i=0;i<anz;i++) partikel.push({x:cx+rnd(-40,40),y:cy+rnd(-26,26),s:3+Math.random()*7,
    vx:rnd(-330,330),vy:rnd(-380,-40),c:Math.random()<.3?f:brocken,l:1,rot:rnd(0,6),
    dr:rnd(-9,9),hoch:.6+Math.random()*.8});
  if(op.gold&&gut(op)){ funkeln(); S.blitz=1; S.blitzF="#F0CE85"; S.schuettel=7; summen(30); banner("Goldene Mauer"); }
  else if(gut(op)){ klirren(Math.min(7,S.serie-1)); S.blitz=.5; S.blitzF="#7FE3C4"; summen(8); }
  else { dumpf(); S.blitz=.7; S.blitzF="#C4634A"; S.schuettel=9; summen(35); }
  if(S.serie===3) banner("Serie!");
  if(S.serie===7) banner("In Fahrt");
  if(S.serie===12) banner("Unaufhaltsam");
  zeigeSerie();
  S.durch++;
  elTore.textContent=S.durch+" / "+ANZ;
  const ab=abschnittVon(S.durch);
  if(ab.n!==S.abschnitt){ S.abschnitt=ab.n; if(S.durch>1){ banner(ab.n); rumpeln(); } }
  if(S.durch===1) elFuss.textContent="Grün ist selten. Rot kostet — aber unterschiedlich viel.";
  else if(S.durch===8) elFuss.textContent="Goldene Ringe geben Schutz — der nächste Verlust prallt ab.";
  else if(S.durch===7) elFuss.textContent="Fällst du unter zwanzig Denare, ist der Lauf vorbei.";
  else if(S.durch===3) elFuss.textContent="Sind alle Mauern rot, nimm die mit dem kleinsten Verlust.";
  else if(S.durch===13) elFuss.textContent="Ab hier meist vier Mauern — und nur eine ist grün.";
  else if(S.durch===ANZ-2) elFuss.textContent="Die letzten zwei Mauern zählen doppelt.";
  if(S.silber<TOD && !S.tot){
    S.tot=true; lauf=false;
    S.blitz=1; S.blitzF="#C4634A"; S.schuettel=16; dumpf(); summen(120);
    banner("Alles verloren");
    setTimeout(ende,1100);
    return;
  }
  if(S.durch>=ANZ) setTimeout(ende,900);
}
function schleife(t){
  if(!lauf) return;
  const dt=Math.min(.05,(t-letzte)/1000||0); letzte=t;
  S.zeit+=dt;
  S.x += (S.ziel-S.x)*Math.min(1,dt*12);
  const v=tempoBei(S.durch);
  S.weg+=v*dt;
  S.tore.forEach(o=>{ o.y+=v*dt; if(!o.felder && o.y>-H*0.9) konkret(o); });
  S.raeuber.forEach(o=>o.y+=v*dt); S.talis.forEach(o=>o.y+=v*dt);
  const cx=S.x*W, cy=H*0.74;
  spur.push({x:cx,y:cy}); if(spur.length>10) spur.shift();
  S.tore.forEach(tor=>{ if(!tor.fertig && tor.felder && tor.y+72>=cy && tor.y<=cy){ tor.fertig=true; durchfahrt(tor); } });
  S.talis.forEach(t=>{
    if(t.fertig) return;
    if(Math.abs(t.y-cy)<26 && Math.abs(t.x*W-cx)<34){
      t.fertig=true; S.schutz=Math.min(3,S.schutz+1);
      funkeln(); summen(25); S.blitz=.8; S.blitzF="#F0CE85";
      schweber.push({x:cx,y:cy-70,t:"SCHUTZ",c:"#F0CE85",l:1,gr:16});
      for(let i=0;i<18;i++) partikel.push({x:t.x*W,y:t.y,s:2+Math.random()*3,vx:rnd(-160,160),vy:rnd(-200,-30),c:"#F0CE85",l:1,rot:0,dr:4,hoch:1});
    } else if(t.y>cy+40){ t.fertig=true; }
  });
  S.raeuber.forEach(r=>{
    if(r.fertig) return;
    if(Math.abs(r.y-cy)<22 && Math.abs(r.x*W-cx)<30){
      r.fertig=true;
      const vor=S.silber; S.silber=Math.max(0,S.silber*.85); S.serie=0; zeigeSerie();
      schweber.push({x:cx,y:cy-54,t:"−"+kurz(Math.round(vor-S.silber)),c:"#FFE1D8",l:1,gr:19});
      dumpf(); S.schuettel=11; S.blitz=.8; S.blitzF="#C4634A"; summen(50);
      for(let i=0;i<14;i++) partikel.push({x:cx,y:cy,s:2+Math.random()*3,vx:rnd(-160,160),vy:rnd(-220,-40),c:"#C4634A",l:1});
    } else if(r.y>cy+40){ r.fertig=true; }
  });
  S.zeige += (S.silber-S.zeige)*Math.min(1,dt*7);
  if(Math.abs(S.silber-S.zeige)<1) S.zeige=S.silber;
  elScore.textContent=fmt(S.zeige);
  partikel.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=680*dt; p.l-=dt*1.25; p.rot=(p.rot||0)+(p.dr||0)*dt; });
  if(partikel.length>260) partikel.splice(0,partikel.length-260);
  partikel=partikel.filter(p=>p.l>0);
  schweber.forEach(s=>{ s.y-=44*dt; s.l-=dt*1.0; });
  schweber=schweber.filter(s=>s.l>0);
  S.schuettel=Math.max(0,S.schuettel-dt*38);
  S.blitz=Math.max(0,S.blitz-dt*2.6);
  rahmen();
  requestAnimationFrame(schleife);
}

const FREUND="Artemiy", FREUND_VOLL="Artemiy Miklyaev", SCHENKER="Klaus";
const GESCHICHTE=[
  {e:"Lukas 19, Vers 12", h:"Der Herr zieht fort",
   t:"„Ein Mann von edler Herkunft zog in ein fernes Land, um ein Königtum zu erlangen und dann zurückzukommen.“ Bevor er ging, regelte er, was mit seinem Geld geschehen sollte."},
  {e:"Lukas 19, Vers 13", h:"Handelt damit",
   t:"„Der ließ zehn seiner Knechte rufen und gab ihnen zehn Pfund und sprach zu ihnen: Handelt damit, bis ich wiederkomme.“ Jeder bekam dasselbe: ein Pfund. Kein Vorsprung, keine Ausrede."},
  {e:"Was ein Pfund war", h:"Hundert Denare",
   t:"Ein Pfund — eine Mine — waren hundert Denare. Und ein Denar war der Lohn eines ganzen Arbeitstages. Wer ein Pfund in der Hand hielt, hielt hundert Tage seines Lebens in der Hand."},
  {e:"Lukas 19, Verse 16 bis 20", h:"Zehn, fünf, und eines im Tuch",
   t:"Der erste kam zurück und sprach: Herr, dein Pfund hat zehn Pfund eingebracht. Der zweite hatte fünf. Der dritte sagte: „Herr, siehe da, hier ist dein Pfund, das ich in einem Tuch verwahrt habe.“ Er hatte nichts verloren. Er hatte auch nichts gewonnen."},
  {e:"Und jetzt du", h:"Die Gasse der Mauern",
   t:"Du bekommst dasselbe wie sie: ein Pfund, hundert Denare. Vor dir liegen achtundzwanzig Mauern, und die meisten kosten dich etwas, egal welche du nimmst. Am Ende der Gasse steht der Herr und hält Abrechnung.",
   f:"Grün ist selten · Mittig durchbrechen zählt doppelt · Fällst du unter zwanzig Denare, ist es vorbei"}
];
function geschichte(k){
  const g=GESCHICHTE[k];
  const o=overlay(
    '<div class="eyebrow">'+g.e+'</div>'+
    '<h2 style="font-size:26px;margin-top:8px">'+g.h+'</h2>'+
    '<p class="hint" style="margin-top:14px;font-size:15.5px">'+g.t+'</p>'+
    (g.f?'<p class="hint" style="margin-top:14px;color:var(--gold)">'+g.f+'</p>':'')+
    '<div class="eyebrow" style="margin-top:20px">'+(k+1)+' von '+GESCHICHTE.length+'</div>'+
    '<button class="btn" id="w">'+(k<GESCHICHTE.length-1?"Weiter":"Er wartet auf dich")+'</button>'+
    (k<GESCHICHTE.length-1?'<button class="btn quiet" id="s">Überspringen</button>':''));
  o.querySelector("#w").onclick=()=>{ audio(); o.remove();
    if(k<GESCHICHTE.length-1) geschichte(k+1); else { try{localStorage.setItem("gasse.story","1");}catch(e){} startLauf(); } };
  const sk=o.querySelector("#s");
  if(sk) sk.onclick=()=>{ audio(); o.remove(); try{localStorage.setItem("gasse.story","1");}catch(e){} start(); };
}

function rangVon(s){
  if(s<TOD)      return {t:"Im Tuch verwahrt", d:"Am Ende der Gasse steht der Herr, und du hast ihm nichts zu zeigen. So wie der dritte Knecht, der sein Pfund in ein Tuch wickelte und weglegte — nur dass du es wenigstens versucht hast.", tot:true};
  if(s<START)    return {t:"Weniger als am Anfang", d:"Du bist losgezogen und ärmer zurückgekommen. Immerhin bist du losgezogen."};
  if(s<300)      return {t:"Treu im Geringsten", d:"Mehr als ein Pfund, aber nicht viel mehr. „Weil du im Geringsten treu gewesen bist“ — der Satz gilt auch für kleine Gewinne."};
  if(s<500)      return {t:"Ein Knecht, der gehandelt hat", d:"Aus einem Pfund sind mehrere geworden. Genau das war der Auftrag."};
  if(s<1000)     return {t:"Herr über fünf Städte", d:"Fünf Pfund und mehr. „Und du sollst über fünf Städte sein“, sagte der Herr zum zweiten Knecht."};
  return {t:"Herr über zehn Städte", d:"Zehn Pfund und mehr — das Ergebnis des ersten Knechts. „Weil du im Geringsten treu gewesen bist, sollst du Macht haben über zehn Städte.“"};
}
function zaehlerHoch(el,ziel,dauer,dann){
  const t0=performance.now();
  (function z(t){
    const p=Math.min(1,(t-t0)/dauer), e=1-Math.pow(1-p,3);
    el.textContent=fmt(ziel*e);
    if(p<1){ if(Math.random()<.3) ton(700+Math.random()*500,.05,"square",.02); requestAnimationFrame(z); }
    else if(dann) dann();
  })(t0);
}
function ende(){
  lauf=false;
  const s=Math.round(S.silber), rekord=s>BEST && s>=TOD;
  merkeBest(s);
  const r=rangVon(s);
  if(rekord && s>START) funkeln();
  const o=overlay(
    (r.tot?'<div class="eyebrow" style="color:var(--rust)">Aus</div>':(rekord?'<div class="eyebrow" style="color:var(--gold)">Neuer Bestwert</div>':'<div class="eyebrow">Am Ende der Gasse</div>'))+
    '<h2 style="font-size:25px;margin-top:6px">'+r.t+'</h2>'+
    '<div class="mono" id="zaehler" style="font-size:clamp(30px,10vw,42px);color:var(--gold);margin:16px 0 4px">0</div>'+
    '<div class="eyebrow">'+(r.tot?"Denare":"Denare · "+stufeMuenze(s).n)+'</div>'+
    '<p class="hint" style="margin-top:14px">'+r.d+'</p>'+
    '<div style="margin-top:16px">'+
      '<div class="tick"><span>Angefangen mit</span><b class="mono">'+fmt(START)+'</b></div>'+
      '<div class="tick"><span>Mauern durchbrochen</span><b class="mono">'+S.durch+' von '+ANZ+'</b></div>'+
      '<div class="tick"><span>Längste Serie</span><b class="mono">'+(S.serieMax||0)+' Mauern</b></div>'+
      '<div class="tick"><span>Bester Lauf</span><b class="mono" style="color:var(--gold)">'+fmt(BEST)+'</b></div>'+
    '</div>'+
    '<button class="btn" id="n">'+(r.tot?"Trotzdem vor ihn treten":"Vor den Herrn treten")+'</button>');
  zaehlerHoch(o.querySelector("#zaehler"), s, 1200);
  o.querySelector("#n").onclick=()=>{ o.remove(); if(r.tot) segen(s); else verdoppeln(s); };
}
function verdoppeln(s){
  const doppelt=s*2;
  const o=overlay(
    '<div class="eyebrow">Das Haus des Herrn</div>'+
    '<h2 style="font-size:25px;margin-top:6px">Die Abrechnung</h2>'+
    '<p style="margin-top:14px">Er sieht auf den Tisch, dann auf dich. „Du bist über wenigem treu gewesen“, sagt er. „Ich will dich über vieles setzen.“</p>'+
    '<p class="hint">Und er legt noch einmal dasselbe daneben.</p>'+
    '<div class="mono" id="z2" style="font-size:40px;color:var(--gold);margin:20px 0 4px">'+fmt(s)+'</div>'+
    '<div class="eyebrow">Denare</div>'+
    '<div class="verse">„Ich sage euch aber: Wer da hat, dem wird gegeben werden; von dem aber, der nicht hat, wird auch das genommen werden, was er hat.“<cite>Lukas 19,26 · Lutherbibel 2017</cite></div>'+
    '<button class="btn" id="w" style="opacity:.35;pointer-events:none">Und nun?</button>');
  const z=o.querySelector("#z2"), w=o.querySelector("#w");
  setTimeout(()=>{ funkeln(); summen(60);
    zaehlerHoch(z, doppelt, 1500, ()=>{ w.style.opacity=1; w.style.pointerEvents="auto"; });
  }, 900);
  w.onclick=()=>{ o.remove(); segen(doppelt); };
}
function segen(s){
  const o=overlay(
    '<div class="eyebrow">Ein Wort zum Schluss</div>'+
    '<h2 style="font-size:25px;margin-top:8px">Der Segen</h2>'+
    '<div class="verse" style="margin-top:18px;font-size:16px;line-height:1.7">'+
      '„Der HERR segne dich und behüte dich;<br>'+
      'der HERR lasse sein Angesicht leuchten über dir und sei dir gnädig;<br>'+
      'der HERR hebe sein Angesicht über dich und gebe dir Frieden.“'+
      '<cite>4. Mose 6,24–26 · Lutherbibel 2017</cite></div>'+
    '<div class="verse" style="margin-top:16px">'+
      '„Recht so, du guter Knecht; weil du im Geringsten treu gewesen bist, sollst du Macht haben über zehn Städte.“'+
      '<cite>Lukas 19,17 · Lutherbibel 2017</cite></div>'+
    '<p class="hint" style="margin-top:18px">Am Ende zählt nicht, wie viel du bekommen hast, sondern was du daraus gemacht hast. Und dass dir jemand etwas anvertraut hat.</p>'+
    '<button class="btn" id="w">Weiter</button>');
  o.querySelector("#w").onclick=()=>{ o.remove(); geburtstag(s); };
}
